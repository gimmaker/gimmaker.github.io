<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- X and Instagram's media servers reject requests that carry our site as the referrer. -->
  <meta name="referrer" content="no-referrer">
  <title>gimmaker</title>
  <meta name="description" content="Small tools for links, posts and media.">
  <meta property="og:title" content="gimmaker">
  <meta property="og:description" content="Small tools for links, posts and media.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✳️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="hero">
    <h1 class="wordmark"><span>gimmaker<sup>®</sup></span></h1>
    <p class="hero-sub"><span>// small tools for links, posts &amp; media</span></p>
  </header>

  <nav class="toolbar" aria-label="Tools">
    <span class="toolbar-label">(Tools)</span>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-embed" aria-controls="panel-embed" aria-selected="true">Gimmick Extractor</button>
      <button class="tab" role="tab" id="tab-tool2" aria-controls="panel-tool2" aria-selected="false" tabindex="-1">Tool 2</button>
      <button class="tab" role="tab" id="tab-tool3" aria-controls="panel-tool3" aria-selected="false" tabindex="-1">Tool 3</button>
      <button class="tab" role="tab" id="tab-tool4" aria-controls="panel-tool4" aria-selected="false" tabindex="-1">Tool 4</button>
    </div>
  </nav>

  <main>
    <section class="panel" role="tabpanel" id="panel-embed" aria-labelledby="tab-embed">
      <div class="panel-head">
        <span>Tool</span>
        <span>(01)</span>
      </div>
      <h2 class="panel-title">Gimmick Extractor</h2>

      <div class="row">
        <div class="row-body">
          <p class="row-label">Paste an X or Instagram link. Get one that shows the full post, video included, in Discord.</p>
          <form id="form" autocomplete="off">
            <label for="link" class="visually-hidden">Post link</label>
            <input id="link" type="url" inputmode="url" required
                   placeholder="Paste a link →">
          </form>
          <p id="error" class="error" role="alert" hidden></p>

          <div id="result" hidden>
            <details class="fixed">
              <summary>Fixed link</summary>
              <button id="fixed-url" class="copy-link" type="button" title="Click to copy"></button>
              <span id="copied" class="copied" aria-live="polite"></span>
            </details>

            <p id="loading" class="muted" hidden></p>
          </div>
        </div>
        <div id="media" class="media"></div>
      </div>
    </section>

    <section class="panel" role="tabpanel" id="panel-tool2" aria-labelledby="tab-tool2" hidden>
      <div class="panel-head"><span>Tool</span><span>(02)</span></div>
      <h2 class="panel-title">Tool 2</h2>
      <div class="row"><p class="row-label">Coming soon.</p></div>
    </section>

    <section class="panel" role="tabpanel" id="panel-tool3" aria-labelledby="tab-tool3" hidden>
      <div class="panel-head"><span>Tool</span><span>(03)</span></div>
      <h2 class="panel-title">Tool 3</h2>
      <div class="row"><p class="row-label">Coming soon.</p></div>
    </section>

    <section class="panel" role="tabpanel" id="panel-tool4" aria-labelledby="tab-tool4" hidden>
      <div class="panel-head"><span>Tool</span><span>(04)</span></div>
      <h2 class="panel-title">Tool 4</h2>
      <div class="row"><p class="row-label">Coming soon.</p></div>
    </section>
  </main>

  <script src="tabs.js?v=8"></script>
  <script src="config.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
